<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>angel's corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&amp;family=Karla:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="floaties" id="floaties" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="topbar__brand">angel's corner</h1>
  </header>

  <nav class="menu" id="menu" aria-label="Main menu">
    <button class="menu__btn" id="menuBtn" aria-expanded="false" aria-controls="menuPanel" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <div class="menu__scrim" id="menuScrim"></div>
    <aside class="menu__panel" id="menuPanel">
      <a href="#">home</a>
      <a href="#">letters</a>
      <a href="#">memories</a>
      <a href="#">our songs</a>
    </aside>
  </nav>

  <div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup">
      <p class="popup__mark" aria-hidden="true">♡</p>
      <h2 class="popup__title" id="popupTitle">This corner is for<br>Angel &amp; Jai</h2>
      <p class="popup__body">please don't peek if you're not one of us</p>
      <div class="popup__actions">
        <button class="btn btn--yes" id="btnOk">ok ♡</button>
      </div>
    </div>
  </div>

  <div class="title-card" id="titleCard">
    <p class="title-card__love">I love you</p>
    <p class="title-card__sig">— Angel</p>
  </div>

  <div class="scene" id="scene">
    <h2 class="scene__title">first kiss</h2>
    <div class="card" id="card" role="button" tabindex="0" aria-pressed="false" aria-label="Flip the photo card">
      <div class="card__inner">
        <div class="card__face card__front">
          <img src="JaiAndMe.jpg" alt="Jai and Angel">
        </div>
        <div class="card__face card__back">
          <p class="card__place">SM City Pampanga</p>
          <p class="card__date">09/19/2026</p>
        </div>
      </div>
    </div>
    <p class="scene__note">tap the card to flip it</p>
  </div>

  <div class="music" id="music">
    <button class="music__tab" id="musicTab" aria-expanded="false" aria-controls="musicPanel" aria-label="Open music player"><span class="music__caret">^</span></button>
    <div class="music__panel" id="musicPanel" role="region" aria-label="Music player">
      <p class="music__now">now playing</p>
      <p class="music__title" id="musicTitle">Say Yes to Heaven</p>
      <p class="music__artist" id="musicArtist">Lana Del Rey</p>
      <div class="music__bar" id="musicBar" aria-hidden="true"><div class="music__fill" id="musicFill"></div></div>
      <div class="music__controls">
        <button class="music__btn" id="prevBtn" aria-label="Previous song" hidden>⏮</button>
        <button class="music__btn music__btn--main" id="playBtn" aria-label="Pause music">❚❚</button>
        <button class="music__btn" id="nextBtn" aria-label="Next song" hidden>⏭</button>
        <button class="music__btn" id="muteBtn" aria-label="Mute music" aria-pressed="false">🔊</button>
      </div>
    </div>
  </div>

  <iframe
    id="scPlayer"
    class="sc-player"
    title="background music"
    allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/mattalexanderreilly/yes-to-heaven-say-yes-to&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=false&amp;show_reposts=false&amp;show_teaser=false&amp;visual=false">
  </iframe>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script src="script.js"></script>

</body>
</html>
